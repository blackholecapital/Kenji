name = "kenji-overwatch-worker"
main = "src/pass14.js"
compatibility_date = "2026-08-29"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[vars]
DEMO_BOOTSTRAP_OPEN = "true"
EILA_RUNTIME_URL = "https://alley-voice.xyz-labs.xyz"
ISLA_VIDEO_VOICE_ID = "eila"
ISLA_VIDEO_AVATAR_IMAGE_URL = "https://eila-overwatch-worker.cryptocapitalgroupfl.workers.dev/eila-avatar.png"
ISLA_VIDEO_AVATAR_PROMPT = "Professional standing AI operator with natural attentive movement, subtle hand gestures, and calm executive presence."

[[d1_databases]]
binding = "DB"
database_name = "kenji-call-center-db"
database_id = "__KENJI_D1_ID__"

[[queues.producers]]
binding = "VIDEO_INGRESS"
queue = "kenji-orch-video-ingress"

[[services]]
binding = "DATA"
service = "kenji-data-worker"

[[services]]
binding = "VIDEO"
service = "blackhole-video-worker"

[[services]]
binding = "VIDEO_QUEUE"
service = "kenji-video-worker"

[[services]]
binding = "HIGHLEVEL"
service = "kenji-highlevel-worker"

[[services]]
binding = "VOICE"
service = "kenji-voice-worker"

[[services]]
binding = "CAMPAIGNS"
service = "kenji-campaign-worker"

[[services]]
binding = "NURTURE"
service = "kenji-nurture-worker"

[[services]]
binding = "SMS"
service = "kenji-sms-worker"

[[services]]
binding = "EMAIL"
service = "kenji-email-worker"

[[services]]
binding = "ORCHESTRATOR"
service = "kenji-orchestrator-worker"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "kenji_overwatch_events"

[observability]
enabled = true

# Bound from default_secrets_store by Kenji/scripts/deploy-with-secrets-store.mjs:
# INTERNAL_CALL_SECRET, EILA_RUNTIME_TOKEN and BLACKHOLE_CAPABILITY_TOKEN.
